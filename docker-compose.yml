version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: fraudshield_db
    environment:
      POSTGRES_USER: fraudshield_user
      POSTGRES_PASSWORD: fraudshield_password
      POSTGRES_DB: fraudshield_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudshield_user -d fraudshield_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
